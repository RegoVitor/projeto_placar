<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo - Placar IFPA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f7;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== CABEÇALHO ===== */

        header {
            background: #5b20b8;
            color: white;
            padding: 22px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        .btn-voltar {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #5b20b8;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-voltar:hover {
            background: #e6e0f4;
        }

        /* ===== ÁREA PRINCIPAL ===== */

        main {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px 40px;
            flex: 1;
        }

        h2 {
            color: #5b20b8;
            font-size: 24px;
            margin-bottom: 25px;
        }

        /* ===== CARD ===== */

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        /* ===== PESQUISA ===== */

        .campo-pesquisa {
            margin-bottom: 25px;
        }

        .campo-pesquisa label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
        }

        .barra-pesquisa {
            position: relative;
        }

        .barra-pesquisa input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        .barra-pesquisa input:focus {
            border-color: #5b20b8;
        }

        .lupa {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        /* ===== JOGOS ENCONTRADOS ===== */

        #jogosEncontrados {
            margin-bottom: 25px;
        }

        .jogo {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }

        .jogo:hover {
            border-color: #5b20b8;
            box-shadow: 0 2px 8px rgba(91, 32, 184, 0.15);
        }

        .modalidade-jogo {
            color: #5b20b8;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .partida {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .partida img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .time {
            width: 100px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
        }

        .placar {
            font-size: 20px;
            font-weight: bold;
            color: #5b20b8;
        }

        .jogo
        /* ===== ÁREA DE PONTUAÇÃO ===== */

        .pontuacao {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .caixa-time {
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .caixa-time h3 {
            color: #5b20b8;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .caixa-time input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 25px;
            text-align: center;
        }

        .caixa-time input:focus {
            outline: none;
            border-color: #5b20b8;
        }

        /* ===== BOTÕES ===== */

        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .botoes button {
            padding: 14px;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .atualizar {
            background: #1976d2;
        }

        .finalizar {
            background: #d32f2f;
        }

        .iniciar {
            background: #2e7d32;
        }

        .botoes button:hover {
            opacity: 0.9;
        }

        /* ===== MENSAGEM ===== */

        .mensagem {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- ===== CABEÇALHO ===== -->

    <header>

        <h1>🏆 Placar IFPA</h1>

        <button class="btn-voltar" onclick="window.location.href='index.html'">
            ← Voltar para a Página Inicial
        </button>

    </header>


    <!-- ===== CONTEÚDO ===== -->

    <main>

        <h2>
            PAINEL ADMINISTRATIVO
        </h2>

        <div class="card">

            <!-- PESQUISA -->

            <div class="campo-pesquisa">

                <label for="pesquisa">
                    Pesquisar Jogo para Alterar:
                </label>

                <div class="barra-pesquisa">

                    <input type="text" id="pesquisa" placeholder="Digite o nome do time..." oninput="buscarJogos()">

                    <span class="lupa">
                        🔍
                    </span>

                </div>

            </div>


            <!-- JOGOS ENCONTRADOS -->

            <div id="jogosEncontrados"></div>


            <!-- PONTUAÇÃO -->

            <div class="pontuacao">

                <div class="caixa-time">

                    <h3>
                        Time A / Pontos
                    </h3>

                    <input type="number" id="pontosA" value="0" min="0">

                </div>


                <div class="caixa-time">

                    <h3>
                        Time B / Pontos
                    </h3>

                    <input type="number" id="pontosB" value="0" min="0">

                </div>

            </div>


            <!-- BOTÕES -->

            <div class="botoes">

                <button class="iniciar" onclick="iniciarJogo()">
                    ▶ Iniciar Jogo
                </button>

                <button class="atualizar" onclick="atualizarPontos()">
                    Atualizar Pontos
                </button>

                <button class="finalizar" onclick="finalizarJogo()">
                    Finalizar Jogo
                </button>

            </div>


            <!-- MENSAGEM -->

            <div class="mensagem" id="mensagem"></div>

        </div>

    </main>


    <footer>
    </footer>


    <!-- ===== JAVASCRIPT ===== -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>

        /* ==========================================
           JOGO SELECIONADO
        ========================================== */

        let jogoSelecionado = null;


        /* ==========================================
           BUSCAR JOGOS PELO NOME DO TIME
        ========================================== */

        function buscarJogos() {

            const nomeTime = $("#pesquisa").val();

            if (nomeTime.trim() === "") {

                $("#jogosEncontrados").html("");

                return;
            }


            $.ajax({

                url: "endpoint.php",

                type: "GET",

                data: {

                    op: "buscarJogosTime",

                    nomeTime: nomeTime

                },

                dataType: "json",


                success: function (resposta) {

                    console.log(
                        "Jogos encontrados:",
                        resposta
                    );


                    $("#jogosEncontrados").html("");


                    resposta.forEach(function (jogo, indice) {

                        console.log(
                            `${indice}: ${jogo.idJogo}`
                        );


                        $("#jogosEncontrados").append(

                            '<div class="jogo" onclick="selecionarJogo('
                            + jogo.idJogo +
                            ')">' +

                            '<div class="modalidade-jogo">' +
                            jogo.modalidade +
                            '</div>' +

                            '<div class="partida">' +

                            '<img src="' +
                            jogo.img_time_casa +
                            '" width="50">' +

                            '<div class="time">' +
                            jogo.time_casa +
                            '</div>' +

                            '<div class="placar">×</div>' +

                            '<div class="time">' +
                            jogo.time_fora +
                            '</div>' +

                            '<img src="' +
                            jogo.img_time_fora +
                            '" width="50">' +

                            '</div>' +

                            '</div>'
                        );

                    });

                },


                error: function (xhr) {

                    console.error(
                        "Erro na requisição:",
                        xhr.responseText
                    );


                    $("#jogosEncontrados").html(
                        "Erro ao buscar os jogos."
                    );

                }

            });

        }

        function selecionarJogo(idJogo) {

            jogoSelecionado = idJogo;


            console.log(
                "Jogo selecionado:",
                idJogo
            );


            $.ajax({

                url: "endpoint.php",

                type: "GET",

                data: {

                    op: "selecionarJogo",

                    idJogo: idJogo

                },

                dataType: "json",


                success: function (resposta) {

                    console.log(
                        "Dados do jogo selecionado:",
                        resposta
                    );


                    if (resposta.length === 0) {

                        alert(
                            "Jogo não encontrado."
                        );

                        return;
                    }


                    const jogo = resposta[0];


                    /* PONTOS */

                    $("#pontosA").val(
                        jogo.pontos_time_casa
                    );

                    $("#pontosB").val(
                        jogo.pontos_time_fora
                    );


                    /* HABILITA OS CAMPOS */

                    $("#pontosA").prop(
                        "disabled",
                        false
                    );

                    $("#pontosB").prop(
                        "disabled",
                        false
                    );


                    $("#mensagem").text(
                        "Jogo selecionado."
                    );

                },


                error: function (xhr) {

                    console.error(
                        "Erro ao selecionar jogo:",
                        xhr.responseText
                    );

                }

            });

        }

        function atualizarPontos() {

            const pontosA =
                document.getElementById("pontosA").value;

            const pontosB =
                document.getElementById("pontosB").value;


            fetch("endpoint.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },

                body:
                    "op=atualizarJogo" +
                    "&idJogo=" + jogoSelecionado +
                    "&pontos_time_casa=" + pontosA +
                    "&pontos_time_fora=" + pontosB
            })

                .then(response => response.json())

                .then(data => {

                    if (data.sucesso) {

                        document.getElementById("mensagem").innerText =
                            "Pontos atualizados com sucesso! " +
                            "Time A " + pontosA +
                            " x " + pontosB +
                            " Time B.";

                    } else {

                        document.getElementById("mensagem").innerText =
                            "Erro ao atualizar os pontos.";

                    }

                })

                .catch(erro => {

                    document.getElementById("mensagem").innerText =
                        "Erro ao atualizar os pontos.";

                    console.error(erro);

                });

        }


        function finalizarJogo() {

            const confirmar = confirm(
                "Tem certeza que deseja finalizar este jogo?"
            );


            if (confirmar) {

                fetch("endpoint.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },

                    body:
                        "op=finalizarJogo" +
                        "&idJogo=" + jogoSelecionado
                })

                    .then(response => response.json())

                    .then(data => {

                        if (data.sucesso) {

                            document.getElementById("mensagem").innerText =
                                "Jogo finalizado com sucesso!";

                            document.getElementById("pontosA").disabled =
                                true;

                            document.getElementById("pontosB").disabled =
                                true;

                        } else {

                            document.getElementById("mensagem").innerText =
                                "Erro ao finalizar o jogo.";

                        }

                    })

                    .catch(erro => {

                        document.getElementById("mensagem").innerText =
                            "Erro ao finalizar o jogo.";

                        console.error(erro);

                    });

            }

        }


        function iniciarJogo() {

            const confirmar = confirm(
                "Tem certeza que deseja iniciar este jogo?"
            );


            if (confirmar) {

                fetch("endpoint.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },

                    body:
                        "op=iniciarJogo" +
                        "&idJogo=" + jogoSelecionado
                })

                    .then(response => response.json())

                    .then(data => {

                        if (data.sucesso) {

                            document.getElementById("mensagem").innerText =
                                "Jogo iniciado com sucesso!";

                        } else {

                            document.getElementById("mensagem").innerText =
                                "Erro ao iniciar o jogo.";

                        }

                    })

                    .catch(erro => {

                        document.getElementById("mensagem").innerText =
                            "Erro ao iniciar o jogo.";

                        console.error(erro);

                    });

            }

        }

    </script>

</body>

</html>
