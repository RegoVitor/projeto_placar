<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo - Placar IFPA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f7;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* ===== CABEÇALHO ===== */

        header {
            background: #5b20b8;
            color: white;
            padding: 22px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        /* BOTÃO VOLTAR */
        .btn-voltar {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #5b20b8;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-voltar:hover {
            background: #e6e0f4;
        }

        .menu {
            display: flex;
            gap: 12px;
        }

        .menu button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #5b20b8;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }


        /* ===== ÁREA PRINCIPAL ===== */

        main {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px 40px;
            flex: 1;
        }

        h2 {
            color: #5b20b8;
            font-size: 24px;
            margin-bottom: 25px;
        }


        /* ===== CARD ===== */

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }


        /* ===== PESQUISA ===== */

        .campo-pesquisa {
            margin-bottom: 25px;
        }

        .campo-pesquisa label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
        }

        .barra-pesquisa {
            position: relative;
        }

        .barra-pesquisa input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        .barra-pesquisa input:focus {
            border-color: #5b20b8;
        }

        .lupa {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }


        /* ===== ÁREA DE PONTUAÇÃO ===== */

        .pontuacao {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .caixa-time {
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .caixa-time h3 {
            color: #5b20b8;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .caixa-time input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 25px;
            text-align: center;
        }

        .caixa-time input:focus {
            outline: none;
            border-color: #5b20b8;
        }


        /* ===== STATUS ===== */

        .status {
            margin-bottom: 25px;
        }

        .status label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
        }

        .status select {
            width: 100%;
            padding: 13px;
            border: 2px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            background: white;
        }


        /* ===== BOTÕES ===== */

        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .botoes button {
            padding: 14px;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .atualizar {
            background: #1976d2;
        }

        .finalizar {
            background: #d32f2f;
        }

        .botoes button:hover {
            opacity: 0.9;
        }


        /* ===== MENSAGEM ===== */

        .mensagem {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- ===== CABEÇALHO ===== -->

    <header>

        <h1>🏆 Placar IFPA</h1>

        <!-- BOTÃO VOLTAR -->
        <button class="btn-voltar" onclick="window.location.href='index.html'">
            ← Voltar para a Página Inicial
        </button>

    </header>


    <!-- ===== CONTEÚDO ===== -->

    <main>

        <h2>
            PAINEL ADMINISTRATIVO
        </h2>


        <div class="card">


            <!-- PESQUISA -->

            <div class="campo-pesquisa">

                <label for="pesquisa">
                    Pesquisar Jogo para Alterar:
                </label>

                <div class="barra-pesquisa">

                    <input type="text" id="pesquisa" placeholder="Digite o nome da turma, modalidade ou jogo...">

                    <span class="lupa">
                        🔍
                    </span>

                </div>

            </div>


            <!-- PONTUAÇÃO -->

            <div class="pontuacao">


                <!-- TIME A -->

                <div class="caixa-time">

                    <h3>
                        Time A / Pontos
                    </h3>

                    <input type="number" id="pontosA" value="0" min="0">

                </div>


                <!-- TIME B -->

                <div class="caixa-time">

                    <h3>
                        Time B / Pontos
                    </h3>

                    <input type="number" id="pontosB" value="0" min="0">

                </div>

            </div>


            <!-- STATUS -->

            <div class="status">

                <label for="statusJogo">
                    Status do Jogo:
                </label>

                <select id="statusJogo">

                    <option value="agendado">
                        Agendado
                    </option>

                    <option value="andamento">
                        Em andamento
                    </option>

                    <option value="finalizado">
                        Finalizado
                    </option>

                </select>

            </div>


            <!-- BOTÕES -->

            <div class="botoes">

                <button class="atualizar" onclick="atualizarPontos()">
                    Atualizar Pontos
                </button>

                <button class="finalizar" onclick="finalizarJogo()">
                    Finalizar Jogo
                </button>

            </div>


            <!-- MENSAGEM -->

            <div class="mensagem" id="mensagem"></div>

        </div>

    </main>

    <footer>


    </footer>


    <!-- ===== JAVASCRIPT ===== -->

    <script>

        function atualizarPontos() {

            const pontosA =
                document.getElementById("pontosA").value;

            const pontosB =
                document.getElementById("pontosB").value;

            const status =
                document.getElementById("statusJogo").value;


            document.getElementById("mensagem").innerText =
                "Pontos atualizados com sucesso! " +
                "Time A " + pontosA +
                " x " + pontosB +
                " Time B.";

        }


        function finalizarJogo() {

            const confirmar = confirm(
                "Tem certeza que deseja finalizar este jogo?"
            );


            if (confirmar) {

                document.getElementById("statusJogo").value =
                    "finalizado";


                document.getElementById("mensagem").innerText =
                    "Jogo finalizado com sucesso!";


                document.getElementById("pontosA").disabled =
                    true;

                document.getElementById("pontosB").disabled =
                    true;

            }

        }

    </script>


</body>

</html>
