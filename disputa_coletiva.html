                                                                                                                                                                            <!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">

    <!-- Reutilizando os mesmos estilos da sua aplicação -->
    <style>
        body {
            background-color: #f5f6fa;
        }

        .navbar {
            background-color: #5b21b6 !important;

        .navbar-brand {
            font-weight: bold;
        }

        .conteudo {
            max-width: 1100px;

        }

        .titulo-secao {
            color: #5b21b6;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Estilo customizado para os Cards do Pódio */
        .card-podio {
            background-color: white;
            border-radius: 12px;
            text-align: center;
            padding: 15px;
        }

        .ouro { border: 3px solid #ffc107; }
        .prata { border: 3px solid #adb5bd; }
        .bronze { border: 3px solid #fd7e14; }

</head>

<body>

    <!-- BARRA PRINCIPAL -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">

            <div>

    <!-- CONTEÚDO PRINCIPAL -->

    <!-- Bootstrap JS com Popper para dropdowns funcionarem -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<div class="card mb-4 shadow-sm">

  <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">

    <li class="list-group-item d-flex justify-content-between align-items-center bg-warning-subtle">

        <strong>João Silva</strong> <small class="text-muted">(Informática)</small>

    <!-- 2º Lugar -->

        <span class="badge bg-secondary me-2">2º</span>

    <!-- 3º Lugar -->
    <li class="list-group-item d-flex justify-content-between align-items-center">
