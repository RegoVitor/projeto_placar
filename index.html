  <style>
    body {
      background-color: #f5f6fa;
    }

    .navbar {

    }

    .navbar-brand {
      font-weight: bold;
    }

    .botoes-acesso {
      display: flex;
      gap: 8px;
    }

    .botao-acesso {
      border: none;

      padding: 8px 14px;

    .modalidades {

      padding: 10px 20px;
    }

    .modalidades .dropdown-menu {
      min-width: 220px;
    }

    .conteudo {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .titulo-secao {
      color: #5b21b6;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .jogo {
      background-color: white;
      border: 1px solid #e1ddec;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .modalidade-jogo {
      color: #5b21b6;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .partida {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      text-align: center;
    }

    .time {
      font-weight: bold;
      min-width: 120px;
    }

    .placar {
      font-size: 24px;
      font-weight: bold;
    }

    .ao-vivo {
      color: #dc2626;
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
    }

    .agendado {
      color: #666;
      text-align: center;
      margin-top: 15px;
      margin-bottom: 0;
    }

    @media (max-width: 576px) {

      .botoes-acesso {
        margin-top: 10px;
        width: 100%;
      }

      .botao-acesso {
        flex: 1;
      }

      .partida {
        gap: 10px;
      }

      .time {
        min-width: 80px;
      }

      .placar {
        font-size: 20px;
      }

    }
  </style>

</head>


<body>

  <!--CONTEÚDO PRINCIPAL -->

    <!--JOGOS AO VIVO -->
    <h3 class="titulo-secao">
      AO VIVO
    </h3>
    <section id="jogosAovivo">
      <p>Carregando jogos...</p>
    </section>

    <!-- FIM JOGOS AO VIVO -->



    <!-- INÍCIO JOGOS AGENDADOS -->
    <h3 class="titulo-secao">
      AGENDADOS
    </h3>

    </section>

    <!-- FIM JOGOS AGENDADOS -->


  </main>


  <!-- Bootstrap JavaScript -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <script>
    $(document).ready(function () {

      $.ajax({
        url: "endpoint.php",
        type: 'GET',
        data: {'op': 'jogosAgendados'},
        dataType: 'json',
        success: function (resposta) {
          console.log("Dados salvos com sucesso:", resposta);
          $("#jogosAgendados").html("");
          resposta.forEach((jogo, indice) => {
            console.log(`${indice}: ${jogo.idJogo}`);
            $("#jogosAgendados").append('<div class="jogo"><div class="modalidade-jogo">' + jogo.modalidade + '</div><div class="partida"><div class="time">' + jogo.time_casa + '</div><div class="placar">×</div><div class="time">' + jogo.time_fora + '</div></div><p class="agendado">' + jogo.data_hora + '</p></div>');
          });
        },
        error: function () {
          console.error("Erro na requisição:");
          $("#jogosAgendados").html("Desculpe houve um erro da EQUIPE DE BACK-END, briga com eles...");
        }
      });

      $.ajax({
        url: "endpoint.php",
        type: 'GET',
        data: {'op': 'jogosAovivo'},
        dataType: 'json',
        success: function (resposta) {
          console.log("Dados salvos com sucesso:", resposta);
          $("#jogosAovivo").html("");
          resposta.forEach((jogo, indice) => {
            console.log(`${indice}: ${jogo.idJogo}`);
            $("#jogosAovivo").append('<div class="jogo"><div class="modalidade-jogo">' + jogo.modalidade + '</div><div class="partida"><div class="time">' + jogo.time_casa + '</div><div class="placar">×</div><div class="time">' + jogo.time_fora + '</div></div><p class="agendado">' + jogo.data_hora + '</p></div>');
          });
        },
        error: function () {
          console.error("Erro na requisição:");
          $("#jogosAovivo").html("Desculpe houve um erro da EQUIPE DE BACK-END, briga com eles...");
        }
      });
    });
  </script>
